[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "election-process-assistant"
version = "0.1.0"
description = "Interactive assistant for election process guidance"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["election_assistant*"]
